# Left arm follower parameters (gripper end-effector).
#
# Kp/Kd: PD position-tracking gains for the follower arm.
#   Increasing Kp improves steady-state tracking; Kd adds damping.
#
# Friction model (tanh):
#   tau_fric(w) = Fo + Fv*w + Fc*tanh(k*w)

