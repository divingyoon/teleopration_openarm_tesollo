# Right arm leader parameters (Tesollo DG5F end-effector, 1.685 kg total hand mass).
# Gravity compensation is handled via URDF (tesollo_right_hand/inertials.yaml).
#
# Kp/Kd: shared between bilateral and unilateral control.
#
# Friction model (tanh):
#   tau_fric(w) = Fo + Fv*w + Fc*tanh(k*w)
#   Fc : Coulomb friction magnitude [Nm]
#   k  : tanh steepness near zero velocity
#   Fv : Viscous friction coefficient [Nm*s/rad]
#   Fo : Constant bias/offset torque [Nm]
#
# If the right arm still feels heavier than the left after rebuilding,
# increase Fo per-joint to add upward bias compensation.

LeaderArmParam:
  Kp: [240.0, 240.0, 240.0, 240.0, 24.0, 31.0, 25.0, 16.0]
  Kd: [3.0, 3.0, 3.0, 3.0, 0.2, 0.2, 0.2, 0.2]
  Fc: [0.30,   0.30,   0.40,   0.08,   0.050,   0.083,  0.050,  0.05]
  k:  [30.0, 30.0,  30.0, 130.0, 150.0, 200.0,  100.0,  4.000]
  Fv: [0.063,   0.063,   0.604,   0.813,   0.029,   0.072,  0.084,  0.084]
  Fo: [0.088,   0.088,   0.008,  -0.058,   0.005,   0.009, -0.059, -0.050]
